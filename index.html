<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Relatório de Ocorrências</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="topbar">
    <div class="container">
      <h1>Relatório de Ocorrências</h1>
      <p class="subtitle">Selecione os filtros e exporte o XLSX</p>
    </div>
  </header>

  <main class="container">
    <form id="filtros" class="card" autocomplete="off">
      <div class="grid-2">
        <div class="field">
          <label class="label" for="turmas">Turmas *</label>
          <small class="hint">Use <b>CTRL</b> (Windows) ou <b>⌘</b> (Mac) para selecionar várias.</small>
          <select id="turmas" name="turmas" multiple required size="14" class="control">
            <!-- FUNDAMENTAL I -->
            <optgroup label="Fundamental I">
              <!-- 2º ano EF -->
              <option>2EFA</option>
              <option>2EFB</option>
              <option>2EFC</option>
              <option>2EFD</option>
              <option>2EFE</option>
              <option>2EFF</option>
              <!-- 3º ano EF -->
              <option>3EFA</option>
              <option>3EFB</option>
              <option>3EFC</option>
              <option>3EFD</option>
              <option>3EFE</option>
              <option>3EFF</option>
              <option>3EFG</option>
              <!-- 4º ano EF -->
              <option>4EFA</option>
              <option>4EFB</option>
              <option>4EFC</option>
              <option>4EFD</option>
              <option>4EFE</option>
              <option>4EFF</option>
              <option>4EFG</option>
              <option>4EFH</option>
              <!-- 5º ano EF -->
              <option>5EFA</option>
              <option>5EFB</option>
              <option>5EFC</option>
              <option>5EFD</option>
              <option>5EFE</option>
              <option>5EFF</option>
              <option>5EFG</option>
              <option>5EFH</option>
            </optgroup>

            <!-- FUNDAMENTAL II -->
            <optgroup label="Fundamental II">
              <!-- 6º ano -->
              <option>6 A</option>
              <option>6 B</option>
              <option>6 C</option>
              <option>6 D</option>
              <option>6 E</option>
              <option>6 F</option>
              <option>6 G</option>
              <option>6 H</option>
              <option>6 I</option>
              <!-- 7º ano -->
              <option>7 A</option>
              <option>7 B</option>
              <option>7 C</option>
              <option>7 D</option>
              <option>7 E</option>
              <option>7 F</option>
              <option>7 G</option>
              <option>7 H</option>
              <!-- 8º ano -->
              <option>8 A</option>
              <option>8 B</option>
              <option>8 C</option>
              <option>8 D</option>
              <option>8 E</option>
              <option>8 F</option>
              <option>8 G</option>
              <!-- 9º ano -->
              <option>9 A</option>
              <option>9 B</option>
              <option>9 C</option>
              <option>9 D</option>
              <option>9 E</option>
              <option>9 F</option>
              <option>9 G</option>
              <option>9 H</option>
            </optgroup>

            <!-- ENSINO MÉDIO -->
            <optgroup label="Ensino Médio">
              <!-- 1ª série EM -->
              <option>1 A</option>
              <option>1 B</option>
              <option>1 C</option>
              <option>1 D</option>
              <option>1 E</option>
              <option>1 F</option>
              <option>1 G</option>
              <!-- 2ª série EM -->
              <option>2 A</option>
              <option>2 B</option>
              <option>2 C</option>
              <option>2 D</option>
              <option>2 E</option>
              <!-- 3ª série EM -->
              <option>3 A</option>
              <option>3 B</option>
              <option>3 C</option>
              <option>3 D</option>
              <option>3 E</option>
            </optgroup>
          </select>
        </div>

        <div class="field">
          <label class="label" for="ocorrencias">Ocorrências *</label>
          <small class="hint">Pode selecionar uma ou várias.</small>
          <select id="ocorrencias" name="ocorrencias" multiple required size="14" class="control">
            <option>Sem Lição de Casa</option>
            <option>Convocação para recuperação</option>
            <option>Orientação ao aluno quanto a sua conversa</option>
            <option>Atraso na troca de aula</option>
            <option>Não realizou atividade em sala</option>
            <option>Ocorrência pedagógica</option>
            <option>Retira da sala por indisciplina</option>
            <option>Sem material</option>
            <option>Sem uniforme</option>
            <option>Suspensão</option>
            <option>Retirada de sala por falta de lição de casa</option>
            <option>Excelente participação</option>
            <option>Lição Incompleta</option>
            <option>Comportamento inadequado em sala</option>
            <option>Não entregou atividade avaliativa</option>
            <option>Material Incompleto</option>
            <option>Sem livro paradidático na aula de Leitura</option>
            <option>Saída para atendimento</option>
            <option>Conversas paralelas</option>
            <option>Esqueceu material</option>
            <option>Esqueceu atividade</option>
            <option>Uso de celular em aula</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label class="label" for="data-inicio">Período – De *</label>
          <input id="data-inicio" name="data_inicio" type="date" class="control" required />
        </div>
        <div class="field">
          <label class="label" for="data-fim">Até *</label>
          <input id="data-fim" name="data_fim" type="date" class="control" required />
        </div>
      </div>

      <div class="actions">
        <button type="button" id="exportar" class="btn btn-primary" disabled>Exportar XLSX</button>
        <span id="status" class="status" aria-live="polite"></span>
      </div>
    </form>
  </main>

  <footer class="footer">
    <div class="container">
      <small>Relatório de Ocorrências • &copy; Nicholas Rieger</small>
    </div>
  </footer>

  <script>window.API_BASE="https://ocorrencias-api-i9or.onrender.com";</script>
  <script src="app.js"></script>


</body>

</html>
